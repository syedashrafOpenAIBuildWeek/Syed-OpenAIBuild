<svg width="680" height="464" viewBox="0 0 680 464" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Safe Metadata Delete — planning pipeline</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .th { font-size:14px; font-weight:600; }
  .ts { font-size:12px; }
  .blue rect { fill:#ddf4ff; stroke:#0969da; stroke-width:0.75; }
  .blue .th { fill:#0550ae; }
  .blue .ts { fill:#0969da; }
  .amber rect { fill:#fff8c5; stroke:#9a6700; stroke-width:0.75; }
  .amber .th { fill:#7d5300; }
  .amber .ts { fill:#9a6700; }
  .arr { stroke:#8c959f; stroke-width:1.5; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="blue">
  <rect x="220" y="40" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">1. Parse intent</text>
  <text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">GPT-5.6 reads the command</text>
</g>

<line x1="340" y1="96" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>

<g class="blue">
  <rect x="220" y="156" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">2. Classify target</text>
  <text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">Standard fields are blocked here</text>
</g>

<line x1="340" y1="212" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>

<g class="blue">
  <rect x="220" y="272" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central">3. Scan dependencies</text>
  <text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">Layouts, flows, Apex, reports…</text>
</g>

<line x1="340" y1="328" x2="340" y2="388" class="arr" marker-end="url(#arrow)"/>

<g class="amber">
  <rect x="220" y="388" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central">4. Risk check</text>
  <text class="ts" x="340" y="424" text-anchor="middle" dominant-baseline="central">Hard-block if anything unsafe</text>
</g>
</svg>
