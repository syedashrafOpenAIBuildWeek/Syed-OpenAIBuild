<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Safe Metadata Delete — approval and execution pipeline</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .th { font-size:14px; font-weight:600; }
  .ts { font-size:12px; }
  .box rect { fill:#f6f8fa; stroke:#8c959f; stroke-width:0.75; }
  .box .th, .box .ts { fill:#24292f; }
  .green rect { fill:#d1f4d1; stroke:#1a7f37; stroke-width:0.75; }
  .green .th { fill:#116329; }
  .green .ts { fill:#1a7f37; }
  .arr { stroke:#8c959f; stroke-width:1.5; }
  .leader { stroke:#8c959f; stroke-width:0.75; stroke-dasharray:3,3; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="box">
  <rect x="220" y="40" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Human review</text>
  <text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">Diffs shown, approval checkbox</text>
</g>

<line x1="340" y1="96" x2="340" y2="156" class="arr" marker-end="url(#arrow)"/>

<g class="green">
  <rect x="220" y="156" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="174" text-anchor="middle" dominant-baseline="central">Validate deploy</text>
  <text class="ts" x="340" y="192" text-anchor="middle" dominant-baseline="central">Dry-run check, nothing saved</text>
</g>

<line x1="340" y1="212" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>

<g class="green">
  <rect x="220" y="272" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central">Deploy fixes</text>
  <text class="ts" x="340" y="308" text-anchor="middle" dominant-baseline="central">Dependency edits go live</text>
</g>

<line x1="340" y1="328" x2="340" y2="388" class="arr" marker-end="url(#arrow)"/>

<g class="green">
  <rect x="220" y="388" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="406" text-anchor="middle" dominant-baseline="central">Destructive delete</text>
  <text class="ts" x="340" y="424" text-anchor="middle" dominant-baseline="central">Target + fully-emptied components</text>
</g>

<line x1="340" y1="444" x2="340" y2="474" class="arr" marker-end="url(#arrow)"/>

<g class="box">
  <rect x="220" y="474" width="240" height="56" rx="8"/>
  <text class="th" x="340" y="492" text-anchor="middle" dominant-baseline="central">Workspace sync</text>
  <text class="ts" x="340" y="510" text-anchor="middle" dominant-baseline="central">Results copied into local repo</text>
</g>

<text class="ts" x="490" y="330" text-anchor="middle" fill="#57606a">↻ any failure → rollback</text>
<path class="arr leader" fill="none" d="M460 300 Q 560 300 560 330 Q 560 360 462 388" marker-end="url(#arrow)"/>
</svg>
